<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Route Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=MedievalSharp&display=swap" rel="stylesheet">
    <style>
        :root{--ink:#e9e9e9;--bg1:#0b0b0b;--bg2:#1a1a1a;--paper:#171717;--paper2:#1f1f1f;--accent:#8d0a0a;--radius:14px;--gap:clamp(10px,2.5vw,18px);--f:clamp(15px,1.35vw,18px);--h1:clamp(1.4rem,2.6vw + .6rem,2.2rem)}
        *{box-sizing:border-box}
        body{margin:0;font:var(--f) Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;color:var(--ink);background:radial-gradient(60% 40% at 10% 5%,var(--bg1),var(--bg2)) fixed,linear-gradient(135deg,var(--bg1),var(--bg2));background-blend-mode:multiply}
        .wrap{max-width:900px;margin:auto;padding:clamp(8px,2.5vw,20px)}
        .book{background:var(--paper);border-radius:var(--radius);box-shadow:0 24px 60px rgba(0,0,0,.6),inset 0 0 0 2px rgba(255,255,255,.04);overflow:hidden}
        .header{padding:clamp(14px,3vw,24px)}
        h1{margin:0 0 6px;font-weight:800;font-size:var(--h1)}
        .crumbs{margin:0 0 10px;color:#bdbdbd}
        .crumbs a{color:#bdbdbd;text-decoration:none}
        .section{margin:var(--gap);padding:clamp(12px,2.6vw,18px);background:linear-gradient(#1c1c1c,#161616);border:1px dashed #3a3a3a;border-radius:14px;box-shadow:0 12px 26px rgba(0,0,0,.5)}
        .calc{background:var(--paper2);border:1px solid #2f2f2f;border-radius:12px;padding:12px;display:grid;gap:10px}
        .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
        .row label{display:grid;gap:6px;font-weight:600;color:#e3e3e3}
        input[type="number"],input[type="text"]{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #3a3a3a;background:#141414;color:#f5f5f5}
        .btn{appearance:none;border:1px solid #3a3a3a;background:#1f1f1f;color:#fff;padding:10px 14px;border-radius:10px;font-weight:800;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.6)}
        .btn:hover{background:#252525}
        .result{background:#181818;border:1px dashed #3a3a3a;border-radius:10px;padding:10px 12px;display:grid;gap:6px}
        table{width:100%;border-collapse:collapse}
        th,td{padding:8px 10px;border-bottom:1px solid #2a2a2a;text-align:right}
        th:first-child,td:first-child{text-align:left}
        .row.eight {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }

        @media (min-width: 480px) { .row.eight { grid-template-columns: repeat(2, minmax(60px, 1fr)); } }
        @media (min-width: 640px) { .row.eight { grid-template-columns: repeat(4, minmax(60px, 1fr)); } }
        @media (min-width: 992px) { .row.eight { grid-template-columns: repeat(6, minmax(60px, 1fr)); } }
        @media (min-width: 1200px){ .row.eight { grid-template-columns: repeat(8, minmax(60px, 1fr)); } }

        .icon-input {
            display: flex;
            flex-direction: column;     /* stack icon above input */
            align-items: center;        /* center horizontally */
            justify-content: center;    /* center vertically if needed */
            gap: 4px;
            text-align: center;
        }

        .icon-input img {
            width: 32px;
            height: 32px;
            object-fit: contain;
            display: block;
            margin: 0 auto;             /* ensure icon is centered in its own box */
        }

        .input-compact {
            max-width: 80px;
            text-align: center;
            font-variant-numeric: tabular-nums;
            padding: 6px 8px;
            border-radius: 8px;
            border: 1px solid #3a3a3a;
            background: #141414;
            color: #f5f5f5;
        }

            /* Optional: subtle hover effect */
        .input-compact:focus {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
        }

        /* bottom-right result stamp */
        .calc-stamp {
            position: fixed;          /* attach to viewport */
            right: 16px;
            bottom: 16px;
            width: clamp(80px, 18vw, 160px);
            height: auto;
            opacity: 0;
            transform: translateY(16px) scale(0.96);
            transition: opacity .35s ease, transform .35s ease;
            pointer-events: none;     /* purely decorative unless you enable dismiss */
            z-index: 60;              /* above cards */
            filter: drop-shadow(0 8px 20px rgba(0,0,0,.5));
        }

        .calc-stamp.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* optional: tighter bottom spacing on tiny screens */
        @media (max-width: 420px) {
            .calc-stamp { right: 10px; bottom: 10px; }
        }

        /* a11y: reduce motion users */
        @media (prefers-reduced-motion: reduce) {
            .calc-stamp {
                transition: none;
                transform: none;
            }
        }

    </style>
</head>
<body>
    <div class="wrap">
        <div class="book">
            <header class="header">
                <div class="crumbs"><a href="index.html">Home</a> > <a href="tools.html">Tools</a> > <span>Route Calculator</span></div>
                <h1>Route Calculator</h1>
                <p class="muted">Get the optimal Farming Strat based on the market prices (UPDATED ON HALLOWEEN CHESTS</p>
            </header>


            <section class="section">
                <p class="muted">Market Prices (Silvers)</p>
                <div class="calc" role="form" aria-label="Calculator form">
                    <div class="row eight">
                        <label class="icon-input">
                            <img src="../img/tinc.png" alt="" title="tincs">
                            <input type="number" class="input-compact" id="tincs"  placeholder="0" aria-label="tincs">
                        </label>

                        <label class="icon-input">
                            <img src="../img/sere.png" alt="" title="sere">
                            <input type="number" class="input-compact" id="sere"  placeholder="0" aria-label="sere">
                        </label>

                        <label class="icon-input">
                            <img src="../img/master.png" alt="" title="master">
                            <input type="number" class="input-compact" id="master"  placeholder="0" aria-label="master">
                        </label>

                        <label class="icon-input">
                            <img src="../img/green.png" alt="" title="green">
                            <input type="number" class="input-compact" id="green"  placeholder="0" aria-label="green">
                        </label>

                        <label class="icon-input">
                            <img src="../img/cert.png" alt="" title="cert">
                            <input type="number" class="input-compact" id="cert"  placeholder="0" aria-label="cert">
                        </label>

                        <label class="icon-input">
                            <img src="../img/sere.png" alt="" title="Rune value">
                            <input type="number" class="input-compact" id="price-rune"  placeholder="0" aria-label="Rune value">
                        </label>

                        <label class="icon-input">
                            <img src="../img/sere.png" alt="" title="Essence value">
                            <input type="number" class="input-compact" id="price-essence"  placeholder="0" aria-label="Essence value">
                        </label>

                        <label class="icon-input">
                            <img src="../img/sere.png" alt="" title="Token value">
                            <input type="number" class="input-compact" id="price-token"  placeholder="0" aria-label="Token value">
                        </label>
                        </div>
                </div>
                <button class="btn" id="compute">Compute</button>
                <div class="result" id="result" aria-live="polite"></div>
                    <div class="result" id="table-wrap" hidden>
                        <table id="tbl"><thead><tr><th>Farming Method</th><th>G/h</th></tr></thead><tbody></tbody></table>
                    </div>
                    <img
                        id="calc-stamp"
                        class="calc-stamp"
                        src="../img/ouxiie.png"
                        alt="ouxiie"
                        aria-hidden="true"
                    />
                </div>
            </section>

            <footer class="section" style="text-align:center">© 2025 Znell Project — Alexanderis' Secret Playbook</footer>
        </div>
    </div>


    <script>
        function fmt(n){return (Math.round(n*100)/100).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});}
        function compute(){
            const event_money = 0.1
            const event_drop = 0.3
            const tincs = Number(document.getElementById('tincs').value||0);
            const sere = Number(document.getElementById('sere').value||0);
            const master = Number(document.getElementById('master').value||0);
            const green = Number(document.getElementById('green').value||0);
            const shard = Math.max(((Math.max(sere, master)*5)/6), tincs/12);
            const cert = Number(document.getElementById('cert').value||0);
            const tear = (6*tincs)/58.14 - 9;
            const solo_s87 = ((((7*34.22)*(1+event_drop) + (45*green)*(1+event_drop) + (30*tear)*(1+event_drop) + (20*shard)*(1+event_drop) + 34*tincs + 68*sere + 68*master + (17*253)*(1+event_money) + 17*57 + (57/6)*558)/57)*60)/1000;
            const ardir_b_average = ((tincs*3 + sere*7 + master*7 + (tincs/150)*10*3 + 500)*15)/1000;
            const d75 = ((2963 + (10/6)*558 + 15*green + 26*cert + 8*shard + 9*tear)/10.57)*60/1000;
            const halloween_doc = ((1513 + 20*shard + (26/6)*558 + 14*green + 30*tear)/25.30)*60/1000;
            const result = document.getElementById('result');
            
            const tbody = document.querySelector('#tbl tbody');
            tbody.innerHTML = `<tr><td>Solo Sigs87 + LL&GEB</td><td>${fmt(solo_s87)}</td></tr><tr><td>Ardir Bosses (Average Group)</td><td>${fmt(ardir_b_average)}</td></tr><tr><td>d75 + LL&GEB</td><td>${fmt(d75)}</td></tr><tr><td>doc + LL&GEB</td><td>${fmt(halloween_doc)}</td></tr>`;
            document.getElementById('table-wrap').hidden = false;
            const stamp = document.getElementById('calc-stamp');
            if (stamp) {
                stamp.classList.add('show');
            }
        }
        document.getElementById('compute').addEventListener('click', compute);


    </script>
</body>

</html>
