<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Guides</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=MedievalSharp&display=swap" rel="stylesheet">
  <style>
          :root{--ink:#e9e9e9;--bg1:#0b0b0b;--bg2:#1a1a1a;--paper:#171717;--paper2:#1f1f1f;--accent:#8d0a0a;--radius:14px;--gap:clamp(10px,2.5vw,18px);--f:clamp(15px,1.35vw,18px);--h1:clamp(1.6rem,3vw + .6rem,2.4rem);--h3:clamp(1.1rem,1.6vw + .5rem,1.5rem)}
        *{box-sizing:border-box}
        body{margin:0;font:var(--f) Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;color:var(--ink);background:radial-gradient(60% 40% at 10% 5%,var(--bg1),var(--bg2)) fixed,linear-gradient(135deg,var(--bg1),var(--bg2));background-blend-mode:multiply}
        .wrap{max-width:1100px;margin:auto;padding:clamp(8px,2.5vw,20px)}
        .book{background:var(--paper);border-radius:var(--radius);box-shadow:0 24px 60px rgba(0,0,0,.6),inset 0 0 0 2px rgba(255,255,255,.04);overflow:hidden}
        .header{position:relative;text-align:center;padding:clamp(16px,4vw,28px) clamp(10px,3vw,20px) 12px}
        .seal{width:90px;height:90px;margin:auto;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:"MedievalSharp",cursive;background:radial-gradient(circle at 30% 30%,#cf484e,#8f161c 60%,#670b10);box-shadow:0 12px 20px rgba(0,0,0,.55),inset 0 6px 12px rgba(255,255,255,.2)}
        .seal small{display:block;font-size:.7rem;opacity:.9;letter-spacing:2px}
        h1{margin:12px 0 6px;font-weight:800;font-size:var(--h1)}
        .brand{color:var(--accent)}
        .crumbs{display:inline-flex;gap:6px;align-items:center;margin:10px clamp(8px,2vw,16px) 0;padding:6px 10px;background:#131313;border:1px dashed #333;border-radius:10px;font-weight:600;color:#bdbdbd;box-shadow:0 2px 0 rgba(0,0,0,.5)}
        .crumbs a{color:#bdbdbd;text-decoration:none}
        .crumbs a:hover{text-decoration:underline}
        .section{margin:var(--gap);padding:clamp(12px,2.6vw,18px);background:linear-gradient(#1c1c1c,#161616);border:1px dashed #3a3a3a;border-radius:14px;box-shadow:0 12px 26px rgba(0,0,0,.5)}
        .grid{display:grid;gap:14px}
        .cols-3{grid-template-columns:1fr}
        @media(min-width:720px){.cols-3{grid-template-columns:repeat(3,1fr)}}
        .card{background:var(--paper2);border:1px solid #2f2f2f;border-radius:12px;padding:14px;display:grid;gap:8px}
        .card h3{margin:0;font-size:1.02rem}
        .card p{margin:0;color:#cfcfcf}
        .meta{color:#bdbdbd;font-size:.9rem}
        a.btn{display:inline-block;margin-top:6px;background:#1f1f1f;border:1px solid #3a3a3a;color:#fff;padding:10px 12px;border-radius:10px;font-weight:800;text-decoration:none}
        .foot{text-align:center;color:#bdbdbd;padding:16px}
  </style>
</head>
<body>

        <h1><span class="brand">Playbook</span> Guides</h1>
        <p class="meta">Don't Forget Secret Tecnique n.37</p>
      </header>

      <div class="crumbs"><a href="index.html">Home</a> > Guides</div>

      <section class="section">

          </article>

          </article>
          <article class="card">
            <h3>Coming Soon</h3>
            <p>...</p>
            <a class="btn" href="#">Read guide</a>
          </article>
        </div>
      </section>

      <footer class="foot">© 2025 Znell Project — Alexanderis Secret Playbook</footer>
    </div>
  </div>
</body>
</html>
